name: Check out talkative
description: Checks out talkative into ./talkative at a ref, or at its newest release.
inputs:
  token:
    description: A token that can read talkative-app/talkative.
    required: true
  ref:
    description: The branch or tag; empty means the newest release.
    required: false
    default: ''
  sparse:
    description: The folders to check out; empty means all of them.
    required: false
    default: packages/schemas
runs:
  using: composite
  steps:
    - id: ref
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        WANTED: ${{ inputs.ref }}
      run: echo "ref=${WANTED:-$(gh api repos/talkative-app/talkative/releases/latest --jq .tag_name)}" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v7.0.1
      with:
        repository: talkative-app/talkative
        ref: ${{ steps.ref.outputs.ref }}
        path: talkative
        token: ${{ inputs.token }}
        sparse-checkout: ${{ inputs.sparse }}
        persist-credentials: false
