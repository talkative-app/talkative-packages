name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      READ_TOKEN: ${{ secrets.TALKATIVE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - if: env.READ_TOKEN == ''
        run: echo "::notice::TALKATIVE_READ_TOKEN is not set, so packages are not checked."
      - if: env.READ_TOKEN != ''
        uses: ./.github/actions/talkative
        with:
          token: ${{ secrets.TALKATIVE_READ_TOKEN }}
          ref: ${{ vars.TALKATIVE_REF }}
      - if: env.READ_TOKEN != ''
        run: npm test
      - if: env.READ_TOKEN != ''
        run: npm run check
        env:
          BASE_REF: origin/${{ github.base_ref }}
