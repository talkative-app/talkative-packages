name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
        env:
          BASE_REF: origin/${{ github.base_ref }}
