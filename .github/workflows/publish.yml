name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      READ_TOKEN: ${{ secrets.TALKATIVE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - if: env.READ_TOKEN != ''
        uses: ./.github/actions/talkative
        with:
          token: ${{ secrets.TALKATIVE_READ_TOKEN }}
          ref: ${{ vars.TALKATIVE_REF }}
      - if: env.READ_TOKEN != ''
        run: npm run check
      - id: pages
        uses: actions/configure-pages@v6.0.0
      - run: npm run catalog
        env:
          CATALOG_BASE: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
